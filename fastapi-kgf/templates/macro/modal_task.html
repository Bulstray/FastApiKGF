{% macro func_tasks(workers, user) %}

    <div class="modal" id="taskModal">
        <form id="taskForm" action="/tasks" method="post" enctype="multipart/form-data">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>
                        <i class="bi bi-plus-circle"></i>
                        Новая задача
                    </h5>
                    <button class="close-btn" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label class="form-label">Название</label>
                        <input type="text" name="title" class="form-control" placeholder="Введите название задачи"
                               required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Описание</label>
                        <textarea name="description" class="form-control" rows="2" placeholder="Опишите задачу"
                                  required></textarea>
                    </div>
                    <div class="row mb-2">
                        <div class="col-md-6">
                            <label class="form-label">Срок</label>
                            <input type="date" name="deadline" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Постановщик</label>
                            <input type="text" class="form-control"
                                   value="{{ user.name }} {{ user.surname }}"
                                   readonly>
                            <input type="hidden" name="customer_id" value="{{ user.id }}">
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Исполнители</label>
                        <select name="executor_ids" class="form-select" multiple size="4" required>
                            {% for worker in workers %}
                                <option value="{{ worker.id }}">{{ worker.name }} {{ worker.surname }}</option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">Удерживайте Ctrl (Cmd) для выбора нескольких</small>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">RAR архив</label>
                        <input type="file"
                               name="rar_file"
                               id="rarFile"
                               style="display: none;"
                               onchange="updateFileName(this)">
                        <div class="rar-upload" onclick="document.getElementById('rarFile').click()">
                            <i class="bi bi-file-zip"></i>
                            <p id="uploadText">Выберите RAR архив</p>
                            <div class="rar-badge">MAX 50MB</div>
                        </div>
                        <div class="selected-file" id="selectedFileBlock" style="display: none;">
                            <div class="d-flex justify-content-between align-items-center mt-1 p-2 border rounded">
                                <div>
                                    <i class="bi bi-file-earmark-zip text-primary"></i>
                                    <span id="fileNameDisplay"></span>
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeFile()">
                                    <i class="bi bi-x"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Создать</button>
                </div>
            </div>
        </form>
    </div>

{% endmacro %}

{% macro tasks_style() %}
    <style>

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            width: 450px;
            max-width: 90%;
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from {
                transform: translateY(-40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 20px 20px 0 0;
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h5 {
            margin: 0;
            font-weight: 650;
            font-size: 1.2rem;
        }

        .modal-header i {
            font-size: 1.3rem;
            margin-right: 8px;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.8;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .modal-body {
            padding: 1.5rem 1.5rem;
        }

        /* Стили для множественного выбора */
        select[multiple] {
            min-height: 110px;
            border: 2px solid #eef2f6;
            border-radius: 10px;
            padding: 0.4rem;
        }

        select[multiple] option {
            padding: 6px 10px;
            border-radius: 6px;
            margin: 2px 0;
        }

        select[multiple] option:checked {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .rar-upload {
            border: 2px dashed #eef2f6;
            border-radius: 14px;
            padding: 1.5rem;
            text-align: center;
            background: #fafbff;
            cursor: pointer;
        }

        .rar-upload i {
            font-size: 2.5rem;
            color: var(--accent-purple);
            margin-bottom: 0.8rem;
        }

        .rar-upload p {
            margin: 0;
            color: var(--primary-dark);
            font-weight: 500;
        }

        .rar-upload small {
            color: var(--text-light);
        }

        .rar-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: white;
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            font-size: 0.75rem;
            margin-top: 0.8rem;
        }

        .modal-footer {
            padding: 1.2rem 1.5rem;
            border-top: 2px solid #eef2f6;
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
        }
    </style>

    <script>
        function updateFileName(input) {
            const fileName = input.files[0]?.name;
            if (fileName) {
                document.getElementById('uploadText').textContent = 'Файл выбран: ' + fileName;
                document.getElementById('selectedFileBlock').style.display = 'block';
                document.getElementById('fileNameDisplay').textContent = fileName;
            }
        }

        function removeFile() {
            document.getElementById('rarFile').value = '';
            document.getElementById('uploadText').textContent = 'Выберите RAR архив';
            document.getElementById('selectedFileBlock').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('show');
            document.getElementById('taskForm').reset();
            removeFile();
        }
    </script>
{% endmacro %}
